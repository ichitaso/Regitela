name: Bug report
description: Report something that doesn't work
body:
  - type: input
    id: ios
    attributes:
      label: iOS version
      description: Settings > General > About > iOS Version
      placeholder: "e.g. 27.1"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "e.g. iPhone 16 Pro"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Regitela version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - IPA (Impactor)
        - IPA (other)
        - Rootless .deb
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Which feature you used, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Copy the output of the Log tab.
      render: text
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
